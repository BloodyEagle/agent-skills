name: skills

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # VERSION, version: в SKILL.md и манифест согласованы, хеши совпадают.
      - run: node skills.js verify
      # Тесты самого CLI (lib/hash.js, check/install/bump/verify).
      - run: node --test test/
